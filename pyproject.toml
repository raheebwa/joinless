[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "joinless"
version = "0.1.0"
description = "Keyless entity resolution: a reproducible classical-vs-neural benchmark"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Aheebwa Ramadhan" }]
# rapidfuzz carries the character-aware classical arm (ADR-0008), which ADR-0014
# places in the base profile. A lower bound only: the exact resolved version is
# recorded in uv.lock.
dependencies = ["rapidfuzz>=3.10"]

[project.scripts]
joinless = "joinless.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-cov>=7.0",
    # The resolver's correctness properties are invariants over all inputs, not
    # behaviours on chosen ones (CONTRIBUTING, "Test policy"). Hypothesis is what
    # makes that statement true rather than aspirational.
    "hypothesis>=6.140",
]
# `tokenizers` is the standalone Rust tokenizer, not `transformers`. An ONNX graph
# takes token ids, so an inference-only install still needs something to produce
# them, and this is the smallest thing that does (ADR-0017).
# `tokenizers` is the standalone Rust tokenizer, not `transformers`: an ONNX graph
# takes token ids, so an inference-only install still needs something to produce
# them, and this is the smallest thing that does (ADR-0017). It depends on
# huggingface_hub, which depends on requests - but only `Tokenizer.from_pretrained`
# reaches for either, and this package loads a local tokenizer.json through
# `Tokenizer.from_file` instead, so neither is on the import path.
neural = [
    "onnxruntime>=1.28",
    "onnx>=1.22",
    "tokenizers>=0.20",
]
# Build-time tooling for producing model artefacts (spikes/quantization/), kept out of
# `neural` because that extra names the inference runtime whose cost the benchmark
# measures — folding export tooling into it would change what the measurement means
# (ADR-0014). Nothing under joinless/ depends on this group.
export = [
    "torch>=2.4",
    "transformers>=4.44",
    "optimum[onnxruntime]>=1.22",
    "onnx>=1.22",
    "huggingface_hub>=0.25",
]

# onnxruntime ships no py.typed marker, so mypy cannot see through it regardless of
# which module imports it (ADR-0002).

[[tool.mypy.overrides]]
# These ship no type stubs. Several live in the `export` group, and the type-check
# job installs `dev,neural` rather than every group, so they are absent when it runs.
# Their absence is a property of the profile under test, not a defect in this code.
module = [
    "huggingface_hub",
    "huggingface_hub.*",
    "onnx",
    "onnx.*",
    "onnxruntime",
    "onnxruntime.*",
    "optimum",
    "optimum.*",
    "tokenizers",
    "tokenizers.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov --cov-branch --cov-report=term-missing"

[tool.coverage.run]
source = ["joinless"]
branch = true
# spikes/ is excluded deliberately, and this is the only exclusion of its kind. It
# holds one completed experiment whose output is already recorded in benchmarks/, it
# ships in no wheel (the build backend packages joinless/ alone), and it will not run
# again. Every other line of shipped code is in scope.

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
# This list REPLACES coverage's default, which is "# pragma: no cover". Dropping that
# default is the point: a pragma is the one-line way to make any number reach 100, and
# a floor that can be waived inline is not a floor. Excluding a line requires editing
# this list, in a diff, with a reason - the three below are lines that cannot execute
# under test rather than lines nobody got round to covering.
exclude_lines = [
    # Runs only when the module is executed as a script, which the suite never does.
    'if __name__ == "__main__":',
    # Evaluated by the type checker, never at run time.
    "if TYPE_CHECKING:",
    # A bare ellipsis is a Protocol member's body (RFC-0001) - a declaration, not code.
    "^\\s*\\.\\.\\.$",
]
