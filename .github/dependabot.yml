version: 2

updates:
  # Actions are pinned to commit SHAs, which are immutable and therefore never
  # pick up a fix on their own. Dependabot rewrites the SHA and the version
  # comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  # pyproject.toml at the repository root is the single declaration of runtime and
  # development dependencies, so the root is the only directory to watch. Runtime and
  # development updates are grouped separately because they carry different risk: one
  # reaches anyone who installs the package, the other only this repository.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      runtime:
        dependency-type: "production"
        patterns:
          - "*"
      development:
        dependency-type: "development"
        patterns:
          - "*"
    # optimum-onnx, reached through optimum[onnxruntime] in the export extra, requires
    # transformers<4.58, so no 5.x release of transformers can be installed alongside it.
    # Proposing one is not a risky update, it is an unsatisfiable one: the resolver
    # refuses the whole set and the update run fails rather than opening a pull request.
    # Minor and patch updates are left alone and still arrive.
    #
    # The cap belongs to optimum-onnx, not to this project, so it is not restated as an
    # upper bound in pyproject.toml. An upper bound there would be published metadata
    # constraining anyone who installs the package, and it would go stale silently the
    # moment optimum-onnx widens its own range. Drop this rule when it does.
    ignore:
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major"]
